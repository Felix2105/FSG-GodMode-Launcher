plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fsg.godmode'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fsg.godmode'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '2.1-UbuntuTouch'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure framework – no external libraries required for maximum compatibility
}
